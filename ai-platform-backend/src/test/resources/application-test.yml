spring:
  datasource:
    url: jdbc:h2:mem:ai_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-with-enough-length-for-hmac-sha256
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173

